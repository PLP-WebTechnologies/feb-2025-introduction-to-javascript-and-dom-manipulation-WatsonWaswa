<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM MANIPULATION</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Welcome to JavaScript DOM Manipulation</h1>
    </header>

    <main>
        <section>
            <h2>Dynamic Text Change</h2>
            <p id="text">This text will change when the button is clicked!</p>
            <button id="changeTextBtn">Change Text</button>
        </section>

        <section>
            <h2>Modify CSS Styles</h2>
            <p id="styledText">This text will change its style!</p>
            <button id="styleTextBtn">Change Style</button>
        </section>

        <section>
            <h2>Add or Remove Elements</h2>
            <button id="toggleElementBtn">Toggle Element</button>
        </section>
    </main>

    <footer>
        <p>Created by Your Name</p>
    </footer>


    <script src="script.js"></script>
</body>
</html>
